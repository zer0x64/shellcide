[package]
name = "shellcide"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI Toolkit
eframe = "0.29.0"

# Assembler (Statically compiled from C source)
keystone-engine = { version = "0.1.0", features = ["build-from-src"] }

# Disassembler
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "intel", "gas", "std"] }

# System APIs
nix = { version = "0.27.1", features = ["ptrace", "signal", "user", "process", "mman", "fs"] }
libc = "0.2.153"

# Thread communication
crossbeam-channel = "0.5.11"
