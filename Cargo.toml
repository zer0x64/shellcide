[package]
name = "shellcide"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI Toolkit
eframe = "0.29.0"

# Assembler
asm-rs = "0.1.1"

# Disassembler
iced_x86 = { package = "iced-x86", version = "1.21.0" }

# System APIs
nix = { version = "0.27.1", features = ["ptrace", "signal", "user", "process", "mman", "fs"] }
libc = "0.2.153"

# Thread communication
flume = "0.11.0"
